<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <style>
      text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="400" fill="#F5F5F3" rx="16" />

  <!-- Círculos decorativos - teal (estudiantes) -->
  <circle cx="180" cy="200" r="110" fill="#1D9E75" opacity="0.10" />
  <circle cx="180" cy="200" r="75" fill="#1D9E75" opacity="0.16" />
  <circle cx="180" cy="200" r="40" fill="#1D9E75" opacity="0.28" />

  <!-- Círculos decorativos - azul (docentes) -->
  <circle cx="1060" cy="110" r="65" fill="#185FA5" opacity="0.09" />
  <circle cx="1060" cy="110" r="40" fill="#185FA5" opacity="0.16" />

  <!-- Círculos decorativos - violeta (tecnólogo) -->
  <circle cx="1020" cy="310" r="50" fill="#534AB7" opacity="0.09" />
  <circle cx="1020" cy="310" r="28" fill="#534AB7" opacity="0.16" />

  <!-- Puntos decorativos sueltos -->
  <circle cx="340" cy="65" r="5" fill="#1D9E75" opacity="0.22" />
  <circle cx="850" cy="355" r="4" fill="#1D9E75" opacity="0.18" />
  <circle cx="155" cy="350" r="4" fill="#185FA5" opacity="0.22" />
  <circle cx="700" cy="55" r="5" fill="#534AB7" opacity="0.18" />

  <!-- Bloques de código estilo niños (zona izquierda) -->
  <rect x="90" y="152" width="40" height="40" rx="9" fill="#1D9E75" opacity="0.82" />
  <rect x="134" y="135" width="40" height="40" rx="9" fill="#534AB7" opacity="0.72" />
  <rect x="178" y="168" width="40" height="40" rx="9" fill="#185FA5" opacity="0.78" />
  <rect x="222" y="152" width="40" height="40" rx="9" fill="#1D9E75" opacity="0.68" />

  <!-- Símbolos dentro de los bloques -->
  <text x="110" y="178" font-size="22" fill="#F5F5F3" font-weight="700" text-anchor="middle">&lt;/&gt;</text>
  <text x="154" y="161" font-size="22" fill="#F5F5F3" font-weight="700" text-anchor="middle">{  }</text>
  <text x="198" y="194" font-size="20" fill="#F5F5F3" font-weight="700" text-anchor="middle">#</text>
  <text x="242" y="178" font-size="22" fill="#F5F5F3" font-weight="700" text-anchor="middle">*</text>

  <!-- Título principal -->
  <text x="390" y="178" font-size="56" fill="#1a1a18" font-weight="700" letter-spacing="-1">
    Computa<tspan fill="#1D9E75">Kids</tspan>
  </text>

  <!-- Línea decorativa debajo del título -->
  <line x1="390" y1="198" x2="640" y2="198" stroke="#1D9E75" stroke-width="3" stroke-linecap="round" opacity="0.55" />
  <circle cx="390" cy="198" r="5" fill="#1D9E75" opacity="0.55" />
  <circle cx="640" cy="198" r="5" fill="#1D9E75" opacity="0.55" />

  <!-- Subtítulo -->
  <text x="390" y="238" font-size="22" fill="#5a5a55" font-weight="400" letter-spacing="0.3">
    Plataforma de Pensamiento Computacional Inclusivo
  </text>

  <!-- Tags de rol -->
  <rect x="390" y="266" width="104" height="30" rx="15" fill="#1D9E75" opacity="0.12" />
  <text x="442" y="286" font-size="13" fill="#1D9E75" font-weight="600" text-anchor="middle">Estudiantes</text>

  <rect x="504" y="266" width="82" height="30" rx="15" fill="#185FA5" opacity="0.12" />
  <text x="545" y="286" font-size="13" fill="#185FA5" font-weight="600" text-anchor="middle">Docentes</text>

  <rect x="596" y="266" width="110" height="30" rx="15" fill="#534AB7" opacity="0.12" />
  <text x="651" y="286" font-size="13" fill="#534AB7" font-weight="600" text-anchor="middle">Tecnología</text>

  <!-- Grilla decorativa derecha (ícono de tecnología) -->
  <g transform="translate(970, 165)" opacity="0.13">
    <rect x="0" y="0" width="84" height="84" rx="16" fill="#534AB7" />
    <rect x="14" y="14" width="24" height="24" rx="6" fill="#1D9E75" />
    <rect x="46" y="14" width="24" height="24" rx="6" fill="#185FA5" />
    <rect x="14" y="46" width="24" height="24" rx="6" fill="#185FA5" />
    <rect x="46" y="46" width="24" height="24" rx="6" fill="#1D9E75" />
  </g>

  <!-- Footer: institución -->
  <text x="600" y="372" font-size="13" fill="#a0a09a" font-weight="400" text-anchor="middle" letter-spacing="0.5">
    EEP N° 80 — El Calafate, Santa Cruz, Argentina
  </text>

</svg>